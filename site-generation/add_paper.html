<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Paper</title>
  <meta http-equiv='content-language' content='en-us'>

  <!-- Load simple.css and custom modifications -->
  <link rel="stylesheet" type="text/css" href="../simple.css">
  <link rel="stylesheet" type="text/css" href="../style.css">

  <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>

<body>
  <h1>Add Paper</h1>

  <form id="dataForm">
    <p>
      <label for="title">Title</label>
      <input id="title" name="title" type="text">
    </p>

    <p>
      <label for="authorList">Author List</label>
      <input id="authorList" name="authorList" type="text">
    </p>

    <p>
      <label for="abstract">Abstract</label>
      <input id="abstract" name="abstract" type="text">
    </p>

    <p>
      <label for="journal">Journal</label>
      <input id="journal" name="journal" type="text">
    </p>

    <p>
      <label for="volume">Volume</label>
      <input id="volume" name="volume" type="text">
    </p>

    <p>
      <label for="issue">Issue</label>
      <input id="issue" name="issue" type="text">
    </p>

    <p>
      <label for="number">Number</label>
      <input id="number" name="number" type="text">
    </p>

    <p>
      <label for="pages">Pages</label>
      <input id="pages" name="pages" type="text">
    </p>

    <p>
      <label for="date">Date</label>
      <input id="date" name="date" type="date">
    </p>

    <p>
      <label for="doi">DOI</label>
      <input id="doi" name="doi" type="text">
    </p>

    <p>
      <input id="frontPage" name="frontPage" type="checkbox">
      <label for="frontPage">Front Page</label>
    </p>

    <button type="submit">Generate JSON</button>
    <button type="button" id="copyBtn">Copy to clipboard</button>
  </form>

  <pre id="output"></pre>

  <script>
    const form = document.getElementById("dataForm");
    const output = document.getElementById("output");
    const copyBtn = document.getElementById("copyBtn");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const entry = {};

      entry.title = document.getElementById("title").value;
      entry.authorList = document.getElementById("authorList").value;
      entry.abstract = document.getElementById("abstract").value;
      entry.journal = document.getElementById("journal").value;
      entry.volume = document.getElementById("volume").value;
      entry.issue = document.getElementById("issue").value;
      entry.number = document.getElementById("number").value;
      entry.pages = document.getElementById("pages").value;
      entry.date = document.getElementById("date").value;
      entry.doi = document.getElementById("doi").value;
      entry.frontPage = document.getElementById("frontPage").checked;

      const json = JSON.stringify(entry, null, 2);

      output.textContent = json;
      output.style.display = "block";
      copyBtn.style.display = "inline-block";
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(output.textContent);
        copyBtn.textContent = "Copied!";
        setTimeout(() => { copyBtn.textContent = "Copy to clipboard"; }, 1500);
      } catch (error) {
        copyBtn.textContent = "Could not copy";
      }
    });
  </script>
</body>
</html>
